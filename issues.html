<script id="snapshot" type="application/json">[{"id": 1, "summary": "Dialogue phrase counter cuts scenes short", "description": "Author's own note at OPIL-source.bas:873 - 'DEFEITO NO CONTADOR DE FRASE, CORTA RAPIDO E NAO TERMINA'. FIXED - user confirmed the rebuilt demo plays correctly on 2026-08-05. The earlier hypothesis (DEC z at the loop top vs EXIT IF z=0 at the bottom) turned out to be wrong: the arithmetic is sound and z initial IS the sentence count. Two real defects instead. (1) CORTA RAPIDO: z=RND(8)+1 with IF z>7 THEN z=7 folded 8 onto the one-line solo sentinel 7, giving it 2/8 of the probability mass; 3 in 8 scenes were a single sentence. Now z=RND(7)+1 with no clamp, uniform 1-7. (2) NAO TERMINA: the dialogue area was cleared before the closing WAIT #1500, erasing the last sentence instantly and leaving the scene blank; the clear was also redundant since CLS follows. Removed. Rebuilt and verified under XRoar.", "type": "bug", "status": "done", "priority": "high", "file": "OPIL-source.bas", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["dialog", "logic"]}, {"id": 2, "summary": "Cutscene categories 1-3 were never written", "description": "DEFERRED - revisit only if designing an original story. The author is still working on his, and extending it is not the intent of this repository.\n\nCorrected framing: this is not dead code. After the skyline block at original/OPIL-source.bas:586 there are eight blank lines and then CLS/RETURN - categories 1-3 were never written, so 'z=0 :'z=RND(3)' is an unfilled hook rather than a disabled feature. Uncommenting the randomizer today would make three runs in four fall straight through to CLS with no wait, producing stutter rather than variety.\n\nNotes for whoever picks this up. z does three jobs in the routine - category selector, still/scroll chooser, then window offset - and is overwritten within a few lines of the test. It is safe today only because the branch leaves z as 0, 16 or 32 and never 1-3; a new category needs its own variable. The category tests would also be sequential IFs, not an ELSE chain, so two could fire in one call (same pattern as issue 8). Available without new art: HSCROLL both ways, a random window offset into the 64-wide maps, the EMPTYTILE+CLS colour flash, the safe's row-index lighting sweep, the ten portraits, and the alley 'lights on' easter egg. The existing branch already yields 4 backgrounds x 3 motions = 12 variants. Watch size: the program already spans three segments (P, P.00, P.01) and so is using ugBASIC's overlay mechanism.", "type": "enhancement", "status": "deferred", "priority": "low", "file": "OPIL-source.bas", "created": "2026-08-05", "updated": "2026-08-07", "tags": ["cutscene", "content", "deferred"]}, {"id": 3, "summary": "Document a reliable XRoar invocation", "description": "Verified working: xroar -machine coco2bus -cart rsdos -load-fd0 OPIL-EN.dsk -ao null -timeout 120 -type 'RUN\"LOADER\"\\r'. Key findings: -cart rsdos is mandatory, coco2bus (NTSC) not coco2b (PAL) because WAIT pacing assumes 60Hz, and -type needs \\r not \\n. Written up in the README 'Running it' section. Confirmed by the user on 2026-08-05 via 'make run', which uses this exact invocation, playing the full demo end to end. Screenshot work split out to issue 7.", "type": "task", "status": "done", "priority": "medium", "file": "README.md", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["xroar", "docs"]}, {"id": 4, "summary": "Only two objects were ever written", "description": "DEFERRED on the same grounds as issue 2 - revisit only if designing an original story. The author is still working on his, and extending it is not this repository's intent.\n\nOnly the briefcase (z=0) and the safe (z=1) exist, chosen by z=RND(2), with a run of blank lines before the RETURN where more were clearly planned. Unwritten content rather than a defect.\n\nNote for whoever picks this up: unlike the cutscene hook in issue 2, the chooser here is live, so adding a third object means widening z=RND(2) as well as writing the branch. Each object carries its own dimensions rather than sharing a convention - suitA is 32 wide, suitB 14, safe 19 - so the loop bounds have to match the art. The safe's lights-down/lights-up trick, which reads either the lit row or the dark row of a single sprite by index arithmetic, is the best template to copy.", "type": "enhancement", "status": "deferred", "priority": "low", "file": "OPIL-source.bas", "created": "2026-08-05", "updated": "2026-08-07", "tags": ["object", "content", "deferred"]}, {"id": 5, "summary": "Portrait arrays carry a spare row and column beyond the draw loop", "description": "WONTFIX - not waste, headroom. The maintainer's call on 2026-09-08: OPEN PILANTRA is a BASIC framework as much as a demo, and the author may well add to the portraits later. 176 is a clean 16x11 grid; trimming it to fit today's draw loop would optimise against the author's intent for a saving nothing currently needs.\n\nWhat the survey established, so it need not be redone. The ten portraits at original/OPIL-source.bas:42-265 are each DIM name(176) AS BYTE. The draw loop at :672-682 runs x 0..14 and y 0..9 indexing name(x+y*16), so the highest index read is 14+9*16=158. Two distinct kinds of slack follow. Trailing: indices 159 up, the spare 11th row, which is the only part a lower DIM would reclaim and the source of the 18-byte figure (17 if ugBASIC allocates 0..175 rather than 0..176; never confirmed which). Interior: index 15 of every row, 10 bytes, unreachable because the stride is 16 but the loop stops at 14. Reclaiming the interior would mean re-striding to 15 and changing tools/art.py and both draw subroutines. Neither drawchrl nor drawchrr (:847-862) would need touching for a trailing trim alone.\n\nIf a memory ceiling is ever hit, the spare row and column are the first place to look, and the numbers above are the budget.", "type": "cleanup", "status": "wontfix", "priority": "low", "file": "OPIL-source.bas", "created": "2026-08-05", "updated": "2026-09-08", "tags": ["memory", "wontfix"]}, {"id": 6, "summary": "No build pipeline - .dsk images cannot be rebuilt from source", "description": "RESOLVED - user confirmed 'make run' builds and plays the full demo end to end on 2026-08-05. Added a Makefile that builds the ugBASIC toolchain (ugbc.coco, asm6809, decb) and compiles with: ugbc.coco -C <asm6809> -b <decb> -o build/OPIL.dsk -O dsk OPIL-source.bas. -O dsk reproduces the LOADER.BAS + P/P.00/P.01 layout of the shipped images, confirming how they were built. Four Darwin-specific fixes were needed: Homebrew bison 3 ahead of the system's 2.3, gsed for GNU sed -i, renaming ugbc's encrypt() to avoid the unistd.h collision, and purging the prebuilt Linux x86-64 objects in the ToolShed module. Rebuilt image boots and runs correctly under XRoar; it is not byte-identical to the shipped one (same size, ~20700 bytes differ) because the originals used an older ugbc.", "type": "task", "status": "done", "priority": "high", "file": "Makefile", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["build", "ugbasic", "blocker"]}, {"id": 7, "summary": "Capture a screenshot of a dialogue box and of a scrolling cutscene", "description": "docs/screens/ has the ugBASIC splash, title card, a two-character dialogue and a mid-draw solo scene, but not a speech-bubble frame or a HSCROLL cutscene, the two most illustrative shots for the README.\n\nDONE 2026-09-08. docs/screens/dialogue-bubble.png and docs/screens/cutscene-scroll.png captured and reviewed by the maintainer. Both 640x512 RGBA, matching the six existing shots.\n\ndialogue-bubble.png: two characters with the green speech box at lower right reading 'GOT IT!' and the solid stepped tail. Chosen from a run of six byte-identical frames, so it is the settled middle of the bubble rather than a race. cutscene-scroll.png: the dock skyline at sunset, taken from the 2500ms hold immediately after a confirmed right-scroll (motion across frames 360-365, static from 366), so it is a genuine HSCROLL sequence and not the progressive column draw.\n\nMETHOD, and it contradicts what issue 14 concluded. macOS Screen Recording is granted and scripted capture works today:\n\n    screencapture -x -o -l <window_id> out.png\n\nThat grabs the XRoar window alone at Retina 2x, downscaling to exactly the 640x512 the existing shots use, title bar included. The window id came from the MCP list_windows tool, which works. Procedure: make run TIMEOUT=900, sample about 4 frames a second for several minutes, then pick frames programmatically. The bubble was found by an exact colour match on the box green (94,185,65) in the lower quarter of the frame; the scroll by consecutive-frame diffs plus a horizontal-shift correlation, to tell translation from redraw. Two real scrolls appeared in about five minutes, consistent with the 1-in-3 odds recorded above.\n\nWhat does NOT work is the screen-capture MCP server: enumeration is fine but every pixel capture times out, with the server itself reporting that the permission preflight passed and the stall is inside ScreenCaptureKit. That is a bug in that server, not in this machine or this repository. For the record XRoar 1.10 has SCREENSHOT compiled in with a Shift-S hotkey, but it always routes through the Cocoa save dialog and has no CLI flag, so it is not scriptable.\n\nThe capture scripts were throwaway and live only in a scratchpad, not in tools/, per the precedent from issue 14.", "type": "task", "status": "done", "priority": "low", "file": "docs/screens", "created": "2026-08-05", "updated": "2026-09-08", "tags": ["xroar", "docs"]}, {"id": 8, "summary": "Scene director IFs fall through, so c counts iterations not scenes", "description": "In the main loop (original/OPIL-source.bas:471-492) the three scene tests are sequential IFs, not an ELSE chain. The cutscene block sets sc to 1 or 2, and the very next IF retests sc in the same pass, so one iteration can play cutscene then dialogue then object. INC c therefore counts loop iterations, not scenes.\n\nCORRECTED 2026-09-08. This issue previously claimed the effect was that 'IF c=10 THEN GOTO intro' restarts the intro much sooner than ten scenes. That is backwards. Every iteration plays at least one scene and often two or three, so ten iterations deliver at least ten scenes and the intro comes back LATER than a scene count of ten, not sooner. The real symptom is variance rather than brevity: how much story plays before the restart differs run to run.\n\nScenes per iteration, by the sc value on entry. Entering at sc=0: cutscene runs, then sc=RND(2)+1 is 1 or 2, so a second scene always follows; if that second scene is the dialogue branch its own re-roll lands on 2 one time in five, adding an object. So 2 scenes, or 3 about one time in ten. Entering at sc=1: dialogue, plus an object one time in five, so 1 or 2. Entering at sc=2: object alone, 1. Hard bounds on a full cycle are therefore 10 scenes at minimum and 30 at the unreachable maximum, with real runs somewhere in between (not simulated, so no average is claimed here).\n\nEvidence that the fall-through is deliberate: both chained re-rolls carry steering comments, 'REM pref cut' on the dialogue branch and 'REM pref dialog' on the object branch, so the author was choosing what tends to follow what. Against that, sc is never reset at intro (the 'sc=0 debug line at :445 is commented out), so a restart resumes from whatever scene type was pending.\n\nStill open as a question. The counter behaviour follows from a structure that looks intentional, so confirm the author's intent before changing anything.", "type": "question", "status": "open", "priority": "low", "file": "OPIL-source.bas", "created": "2026-08-05", "updated": "2026-09-08", "tags": ["dialog", "logic"]}, {"id": 9, "summary": "Makefile 'toolchain' target has not been tested from a clean clone", "description": "DONE. Verified end to end from an empty .toolchain/ on macOS (arm64) on 2026-09-08, and the run found two defects that only appear on a clean clone. Both are fixed in commit f76d5e5.\n\n(1) The $(DECB) rule never ran. ToolShed commits its prebuilt Linux x86-64 decb into the submodule (git ls-files lists build/unix/decb/decb plus 15 .o files), so the target existed the moment the checkout finished and make treated it as up to date, skipping the purge recipe entirely. make toolchain printed 'toolchain ready' having built nothing, and the ELF binary was handed to ugbc. The clone recipe now does rm -f $(DECB) so the rule fires. The comment block at Makefile:117 described the purge as if it already covered this case; it now describes what the code does.\n\n(2) The $(DSK) recipe masked the failure. ugbc exits 0 even after 'The compilation of assembly program failed', so make printed 'built build/OPIL.dsk ( bytes)' over a missing file and returned 0. A newcomer got two successes and no disk image. A test -s guard now fails the build. Confirmed to fire rather than merely written: pointing $(DECB) at the stale ELF gives Error 1, exit 2 and no file, where the same situation previously gave exit 0.\n\nAfter the fixes: make toolchain 142s from empty, all three binaries Mach-O arm64, build/OPIL.dsk 161280 bytes matching the shipped size with the same LOADER.BAS + P + P.00 + P.01 directory layout at the same starting granules.\n\nScope of the verification, stated plainly: macOS arm64 only, by a clean-clone build, not by the maintainer watching it on screen. Linux and Windows remain unexercised (issue 17). Also corrected the ~30 min estimate, which was 142s here, and replaced the 'untested' caveats in README.md and docs/MAKE-YOUR-OWN-STORY.md.\n\nLeftovers filed rather than held open: issues 16, 17, 18, 19.", "type": "task", "status": "done", "priority": "medium", "file": "Makefile", "created": "2026-08-05", "updated": "2026-09-08", "tags": ["build", "verification"]}, {"id": 10, "summary": "Speech/thought bubble tail comments look inverted", "description": "RESOLVED by evidence. The manual's own screenshots settle it: the solo scene (one character, in-loop z=6) renders separate dots trailing up - a THOUGHT balloon - while the two-character scene renders a solid stepped tail - a SPEECH balloon. So the branch commented ':REM DIALOG' is in fact the thought balloon and vice versa. The comments are swapped; the POKEs are correct. Documented in docs/MAKE-YOUR-OWN-STORY.md with a warning not to 'fix' the pokes to match the comments. Left the source comments as-is to keep the diff honest to the author's file.", "type": "question", "status": "done", "priority": "low", "file": "OPIL-source.bas", "created": "2026-08-05", "updated": "2026-08-05", "tags": ["dialog", "comments"]}, {"id": 11, "summary": "Adopt the baseline contribution policy", "description": "DONE - reviewed and approved by the maintainer on 2026-08-07. Stamped the canonical baseline CONTRIBUTING.md, filling <PROJECT> as OPEN PILANTRA and <TRACKER> as issues.jsonl. The baseline text is otherwise verbatim; those two placeholders are the only lines altered.\n\nAdded a project-specific section, which is where such rules belong rather than in the shared template: which of story/dialogue.json, art/*.png and original/OPIL-source.bas a given change goes in (and that editing the DATA blocks left in the .bas has no effect); that original/ is the author's work carrying one deliberate fix; not to normalise his formatting, since ugb and til genuinely compile to 16-bit arrays and reordering declarations changes the emitted assembly; that the art PNGs are indexed and an RGB save breaks the round trip; that equivalence is proved by diffing generated assembly rather than eyeballed; and that screen checks need the maintainer because there is no scripted way to read the display (issue 14). Also extended the documented status vocabulary to include deferred and wontfix, both now in use.\n\nBootstrap exception, recorded plainly rather than glossed: this issue was filed alongside the original stamp rather than before it, because the stamp was requested directly.", "type": "task", "status": "done", "priority": "medium", "file": "CONTRIBUTING.md", "created": "2026-08-05", "updated": "2026-08-07", "tags": ["process", "docs"]}, {"id": 12, "summary": "Extract dialogue from OPIL-source.bas to JSON and back", "description": "DONE. story/dialogue.json is the build's source of truth for text. tools/dialogue.py emit renders the ten label+DATA blocks from it; strip produces src/opil.bas, the source minus its DATA blocks plus one INCLUDE. Both outputs are gitignored and the build only ever reads OPIL-source.bas, never writes it. INCLUDE was proved safe before being relied on, since RESTORE reads across it: the same program compiled with DATA inline and with it included emits byte-identical code (2056 instructions on a reduced case, differing only in '; L:n' comments; 6720 on the full demo with one benign peephole difference). lint enforces the authoring constraints and emit refuses to run when it fails. An earlier version also kept the .bas in sync and checked for divergence - removed as unwanted scope.", "type": "task", "status": "done", "priority": "medium", "file": "tools/", "created": "2026-08-06", "updated": "2026-08-06", "tags": ["toolchain", "dialogue", "build"]}, {"id": 13, "summary": "Extract SG4 image arrays to PNG and back", "description": "Both steps built. tools/art.py extract writes the 19 DIM byte arrays to art/*.png plus art/manifest.json; emit converts them back to DIM declarations; strip lifts them out of the source and leaves an INCLUDE. The build now sources graphics from the PNGs and dialogue from the JSON, and OPIL-source.bas is only ever read. PNGs are INDEXED, one pixel per SG4 quadrant, so the round trip never depends on matching RGB and the palette stays cosmetic. Palette measured from XRoar output in docs/screens/, seven of eight colours; yellow approximated. Three things had to be preserved rather than normalised: declaration ORDER, the AS BYTE form (ugb and til omit it and really are 16-bit arrays), and bytes the pixel encoding cannot represent - text-mode cells like capt's value-32 coat, and tiles with a colour but no lit quadrants (144, 192) which are indistinguishable from an empty cell. The extractor detects the last case by round-tripping every byte through the encoder rather than by rule. Verified: all 19 arrays rebuild byte-exact from their PNG, and src/opil.bas compiles to byte-identical assembly with OPIL-source.bas - 6720 instructions, zero diff. Confirmed on screen by the user on 2026-08-07: a clean rebuild from the JSON and the PNGs played normally under XRoar.", "type": "task", "status": "done", "priority": "medium", "file": "tools/", "created": "2026-08-06", "updated": "2026-08-06", "tags": ["toolchain", "graphics", "build"]}, {"id": 14, "summary": "No working way to observe the emulated screen from a script", "description": "WONTFIX - not needed. tools/screenpeek.py has been removed rather than left in tools/ as a half-working script beside working ones.\n\nWhat the attempt established, so it need not be re-derived:\n- XRoar's GDB stub listens on 127.0.0.1:65520 with -gdb, and the packet 'm0400,200' returns the 512-byte 32x16 text screen.\n- Decoding: bit 7 clear is a character cell whose low 6 bits are the character ($00-$1F is '@A-Z[\\]^_', $20-$3F is ' !\"#...?'); bit 7 set is an SG4 graphics cell.\n- ATTACHING HALTS THE CPU. A one-shot read of an already-running program works and was proven (it decoded both the boot screen and a mid-scene graphics screen). Sampling repeatedly needs a continue/interrupt cycle that was never got right - a plain 'c' followed by 0x03 drops the connection.\n- The stub serves one client at a time; opening a fresh connection per sample wedges it.\n- MCP screen capture failed for window AND full-display capture, which points at macOS Screen Recording permission rather than anything in this repository.\n\nCORRECTED 2026-09-08 by the issue 7 capture work. The conclusion above that MCP capture failure 'points at macOS Screen Recording permission' is WRONG. Screen Recording is granted, and scripted capture of the emulator window works today with a one-line shell command:\n\n    screencapture -x -o -l <window_id> out.png\n\nThe MCP server is what is broken: it enumerates windows and displays correctly but times out on every pixel capture, reporting itself that the permission preflight passed and the stall is inside ScreenCaptureKit.\n\nThis does not revive the GDB-stub approach, which remains a dead end for the reasons above, and it does not give a script the decoded TEXT of the screen, which is what this issue originally wanted. It does mean scripted visual verification is possible, so the premise that screen checks always need the maintainer is no longer true. Left as wontfix rather than reopened: the pixel route belongs to whoever needs it next, and CONTRIBUTING.md still states the old premise and should be revisited.", "type": "task", "status": "wontfix", "priority": "low", "file": "-", "created": "2026-08-06", "updated": "2026-09-08", "tags": ["tooling", "xroar", "verification"]}, {"id": 15, "summary": "Authoring guide still describes the pre-PNG art workflow", "description": "Split rather than rewritten, at the maintainer's direction: the guide documents the reference implementation and should not be overwritten to describe ours. original/AUTHORING-REFERENCE.md is the clone that keeps the original way - DATA blocks, DIM arrays, SGEditor CSV pasted into the source - and sits with the source it describes, carrying a banner that it is not how this repo builds. docs/MAKE-YOUR-OWN-STORY.md is now fully converted to the toolchain: edit art/*.png and story/dialogue.json, then make. The two cross-link, and the craft material (writing rules, SG4 byte math, mouth addresses, balloon geometry) appears in both because it is implementation-independent. Also documents the two traps: tools/art.py's hardcoded STRIDES table, and emit silently ignoring a PNG with no manifest entry. Checklist rewritten around make dialogue-lint and the indexed-PNG requirement. Reviewed and approved by the maintainer on 2026-08-08. A follow-up pass also removed the CSV-paste-then-art-extract advice, which was both wrong and destructive, and added a README warning that dialogue-extract and art-extract are bootstrap targets that overwrite story/ and art/ from a .bas which no longer tracks either.", "type": "docs", "status": "done", "priority": "medium", "file": "docs/MAKE-YOUR-OWN-STORY.md", "created": "2026-08-07", "updated": "2026-08-08", "tags": ["docs", "graphics"]}, {"id": 16, "summary": "ugbc output is not byte-reproducible between runs", "description": "Two clean-clone builds from the same ugbc commit and the same source produced different .dsk bytes: 'make compare' reported 21149 differing bytes against the shipped image on one run and 21165 on the next, and the P.01 last-sector-length byte came out '\"' in one and '#' in the other. Something in ugbc's output is nondeterministic, most likely an embedded timestamp or a hash-ordering artefact.\n\nNot a regression and not a blocker: make compare is documented as a structural check, and the directory layout matched on both runs. The consequence worth recording is that the byte counts in compare output are not a stable regression signal, so nobody should treat a changed count as evidence of a changed build. Worth confirming the cause before anyone tries to build a byte-level regression test on top of it.", "type": "question", "status": "open", "priority": "low", "file": "Makefile", "created": "2026-09-08", "updated": "2026-09-08", "tags": ["build", "reproducibility"]}, {"id": 17, "summary": "Toolchain build unexercised on Linux and Windows", "description": "Issue 9 verified the toolchain target from an empty .toolchain/ on macOS arm64 only. Neither Linux nor Windows has been run end to end.\n\nLinux is the more interesting case and the fix from issue 9 matters there too. ToolShed's committed decb is an x86-64 ELF, so before that fix make skipped rebuilding it on Linux as well; it simply happened to work on x86-64 Linux by accident and would fail on arm64 Linux. The rm -f $(DECB) fix is platform-neutral and should improve both. The Darwin branch of the Makefile (gsed, Homebrew bison, the encrypt rename) is skipped on Linux, so that path is genuinely untested as a whole.", "type": "task", "status": "open", "priority": "low", "file": "Makefile", "created": "2026-09-08", "updated": "2026-09-08", "tags": ["build", "verification", "portability"]}, {"id": 18, "summary": "cocofuse build failure leaves a misleading Error 1 in the toolchain log", "description": "During make toolchain on macOS, ToolShed's cocofuse subdirectory fails with \"../../../cocofuse/cocofuse.c:31:10: fatal error: 'fuse.h' file not found\" followed by \"make[2]: *** [cocofuse.o] Error 1\". macOS ships no FUSE headers by default.\n\nHarmless: ToolShed's top-level make all continues past it and decb still links, which is the only binary this project needs. The cost is purely legibility. The next person to read a toolchain log hits a red *** Error 1 partway through a build that then reports success, which is exactly the kind of ambiguity issue 9 was about. Consider building only the decb subdirectory, or noting the expected error in the Makefile comment.", "type": "cleanup", "status": "open", "priority": "low", "file": "Makefile", "created": "2026-09-08", "updated": "2026-09-08", "tags": ["build", "noise"]}, {"id": 19, "summary": "make deps has never been exercised", "description": "The Homebrew path in the deps target is still untested. The issue 9 verification did not reach it because every prerequisite was already installed on the host: bison 3.8.2 from Homebrew correctly shadowing the system's 2.3, gsed 4.10, autoconf 2.73, automake 1.18.1, glibtool 2.6.2, flex 2.6.4, GNU Make 3.81, Apple clang 21.0.0.\n\nSo the documented first step of the build is the one step nobody has run. Testing it properly needs a machine without those formulae, or a throwaway Homebrew prefix, since uninstalling them on a working machine to test the target is not worth it. Low priority: the target is four words of brew install and unlikely to be wrong, but it is the newcomer's very first command.", "type": "task", "status": "open", "priority": "low", "file": "Makefile", "created": "2026-09-08", "updated": "2026-09-08", "tags": ["build", "verification"]}, {"id": 20, "summary": "Build a browsable HTML view of issues.jsonl", "description": "DONE. tools/issues.py render turns issues.jsonl into a self-contained issues.html: no network, no CDN, no server, so it opens straight from file://. Each issue is rendered into the markup at generation time rather than fetched at runtime, because a fetch of a local .jsonl is blocked by CORS under file://. The page therefore reads nothing when opened.\n\nSorted by status then priority then id. Filter pills for status, type and tag (multi-select, OR within a group and AND across groups), full-text search over summaries and descriptions, expand and collapse, and a per-browser memory of the current filters in localStorage, wrapped in try/catch so a private window just opens unfiltered. Deep links work: issues.html#i8 opens issue 8 expanded and overrides a remembered filter that would have hidden it. '/' focuses search. Light and dark both defined.\n\nThe page is committed rather than gitignored: it is small, deterministic and meant to be read, including from a clone by someone who never runs make. That is the opposite call to build/ and generated/, which are large and machine-specific. The cost is that it can fall behind the tracker, so make issues should be run and committed alongside any edit to issues.jsonl. The generator only ever reads the tracker.", "type": "task", "status": "done", "priority": "low", "file": "tools/issues.py", "created": "2026-09-08", "updated": "2026-09-08", "tags": ["tooling", "docs"]}]</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|bas|py|md|html|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  function pills(host, filter, values, counts) {
    document.getElementById(host).innerHTML = values.map(function (v) {
      return '<button class="pill" data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('');
  }

  function save() {
    try {
      localStorage.setItem('opil-issues', JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) { counts[i.status] = (counts[i.status] || 0) + 1; });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));
    pills('f-tag', 'tag', unique([].concat.apply([], issues.map(tagsOf))));

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open. Read from ' +
      '<code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem('opil-issues') || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function snapshot() {
    return JSON.parse(document.getElementById('snapshot').textContent);
  }

  // The live file first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen.
  fetch('issues.jsonl', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (text) {
      draw(text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse));
    })
    .catch(function () {
      draw(snapshot(), 'Showing the snapshot saved when this page was last built, because the ' +
        'browser would not read issues.jsonl from disk. To see the live tracker, serve the ' +
        'directory (python3 -m http.server) and open it over http, or run make issues to rebuild.');
    });
})();
</script>
</body>
</html>
